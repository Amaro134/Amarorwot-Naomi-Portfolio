services:
  - type: web
    name: naomi-portfolio
    runtime: python
    buildCommand: "pip install -r requirements.txt && python case/manage.py collectstatic --noinput"
    startCommand: "cd case && gunicorn case.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DJANGO_SETTINGS_MODULE
        value: case.settings